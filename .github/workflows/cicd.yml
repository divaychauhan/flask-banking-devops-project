name: Flask Banking App CI/CD

on:
  push:
    branches:
      - dev
      - test
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Flask app import
        run: |
          python -c "from app import app; print('Flask app imported successfully')"

      - name: Decide Docker image tag
        id: vars
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=prod-latest" >> $GITHUB_OUTPUT
          elif [ "${GITHUB_REF_NAME}" = "test" ]; then
            echo "IMAGE_TAG=test-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=test-latest" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=dev-latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/banking-app:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/banking-app:${{ steps.vars.outputs.LATEST_TAG }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/banking-app:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/banking-app:${{ steps.vars.outputs.LATEST_TAG }}

  deploy-production:
    needs: build-test-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy on EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/banking-app

            docker pull ${{ secrets.DOCKER_USERNAME }}/banking-app:prod-latest

            docker stop banking-app || true
            docker rm banking-app || true

            docker run -d \
              --name banking-app \
              --env-file .env \
              -p 5000:5000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/banking-app:prod-latest

            docker ps
            docker logs --tail 30 banking-app
            docker image prune -f